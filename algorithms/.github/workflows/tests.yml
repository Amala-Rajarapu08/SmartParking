 name: Smart Parking CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest pytest-cov black mypy

      - name: Check formatting
        run: |
          python -m black --check .

      - name: Run type checking
        run: |
          python -m mypy main.py advanced_features.py algorithms

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Run coverage
        run: |
          python -m pytest --cov=. --cov-report=term-missing